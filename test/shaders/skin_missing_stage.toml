kind = "raster"
depth = true

[vertex]
positions = "vec3"

[pass.vertex]
index = 0
shader = "shaders:/base/3D/color/color.vert.spv"

[pass.fragment]
index = 1
shader = "shaders:/base/3D/color/color.frag.spv"

# a skin replacing a stage the shader does not have, refused
[skin.vertex]

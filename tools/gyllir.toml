compiler = "gyc"
license = "proprietary"
authors = ["Emile Cadorel <ecadorel@gmail.com>"]
description = "Tools working on Balder, built apart from it"
version = "0.1.0"
name = "balder-tools"

[targets.reference]
type = "executable"
description = "Write the reference of the widget types and the style properties in ../doc/gui.md, from the widget registry"
source-dir = "src/reference"
package-root = "main"
tests = false
dependencies = ["Balder"]
libraries = ["SDL3", "SDL3_image", "vulkan", "assimp", "harfbuzz", "freetype"]

[targets.passgraph]
type = "executable"
description = "Draw a render graph exported in json as a graphviz dot graph"
source-dir = "src/passgraph"
package-root = "main"
tests = false

[dependencies]
Balder = {version = "master", url = {git = "git@github.com:Kag-k-thun/Balder.git"}}

[registry]
git = "git@github.com:Kag-k-thun/Balder.git"

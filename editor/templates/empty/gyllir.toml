name = "{{package}}"
description = "{{name}}, a game made with Balder"
version = "0.1.0"
license = "proprietary"

[targets.{{package}}]
type = "library"
description = "The library of {{name}}: its actor classes and what it adds to the engine"
package-root = "{{package}}"
dependencies = ["Balder"]
output-dir = "target/lib"

[targets.editor]
type = "executable"
description = "The editor of {{name}}: the editor of Balder, the actor classes of the game linked in"
source-dir = "editor"
package-root = "main"
output = "{{package}}-editor"
tests = false
dependencies = ["Balder"]
targets = ["{{package}}"]
libraries = ["SDL3", "SDL3_image", "vulkan", "assimp", "harfbuzz", "freetype"]
output-dir = "target/bin"

[dependencies]
Balder = { version = "master", url = { git = "git@github.com:Kag-k-thun/Balder.git" } }

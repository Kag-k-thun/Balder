name = "{{package}}"
description = "{{name}}, a game made with Balder"
version = "0.1.0"
license = "proprietary"

# The compiler of the engine: the library of the game runs in the editor and in the game built with it
[compiler]
version = "{{compiler}}"

[targets.{{package}}]
type = "shared"
description = "The library of {{name}}: its actor classes and what it adds to the engine, loaded by the editor and by the game"
package-root = "{{package}}"
dependencies = ["Balder"]
host-provided = ["Balder"]
output-dir = "target/lib"

[dependencies]
Balder = { version = "master", url = { git = "git@github.com:Kag-k-thun/Balder.git" }, link-targets = ["balder"] }

log-filter = ["Widget", "Swapchain", "Texture2D", "Window", "Memory", "GarbageBin", "VulkanPipeline", "VulkanTransferPass", "Device"]

[window]
name = "Balder projects"
width = {relative = 0.5, min = 900}
height = {relative = 0.5, min = 560}
resizable = true

[vulkan]
version = 13
anisotropy = true
image-count = 3
vsync = true

[timer]
fps = 30
ips = 60
interactive = true

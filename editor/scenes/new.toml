# The scene a new scene of the editor starts from: a ground lit by the sun, a cube and a sphere on it
# (see NodeDescription for the entries of a node)

[[node]]
name = "sun"
type = "light"
light = "direction"
direction = [-0.3, -1.0, -0.2]
intensity = 1.0
position = [0, 6, 0]

[[node]]
name = "ground"
type = "plane"
scale = [20, 1, 20]
color = [0.55, 0.55, 0.55]
roughness = 0.9

[[node]]
name = "props"
type = "group"

[[node.children]]
name = "cube"
type = "cube"
position = [-1.2, 0, 0]
rotation = [0, 30, 0]
color = [0.8, 0.3, 0.2]
roughness = 0.5

[[node.children]]
name = "sphere"
type = "sphere"
position = [1.2, 0, 0]
color = [0.2, 0.4, 0.8]
roughness = 0.2
metallic = 1.0

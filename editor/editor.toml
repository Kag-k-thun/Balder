log-filter = ["Widget", "Swapchain", "Texture2D", "Window", "Memory", "GarbageBin", "VulkanPipeline", "VulkanTransferPass", "Device"]

[window]
name = "Balder editor"
width = {relative = 0.75, min = 1100}
height = {relative = 0.75, min = 680}
resizable = true

[vulkan]
version = 13
anisotropy = true
image-count = 3
vsync = true

[timer]
fps = 30
ips = 30
interactive = true

license = "proprietary"
authors = ["Emile Cadorel <ecadorel@gmail.com>"]
description = "Ymir 3D engine using Vulkan and GLFW"
version = "0.1.22"
name = "Balder"

[compiler]
version = "1.14.3"

[targets.balder]
type = "library"
description = "The Balder engine"
package-root = "balder"
output = "Balder"
dependencies = ["yassimp", "ysdl3", "yvulkan", "yharfbuzz"]
libraries = ["SDL3", "SDL3_image", "vulkan", "assimp", "harfbuzz", "freetype"]
output-dir = "target/lib"

[targets.demo]
type = "executable"
description = "A 3D scene with a few widgets on top of it"
source-dir = "example/demo"
package-root = "main"
tests = false
libraries = ["SDL3", "SDL3_image", "vulkan", "assimp", "harfbuzz", "freetype"]
targets = ["balder"]
output-dir = "target/demos"

[targets.walk]
type = "executable"
description = "A character walking on an endless floor, its clips mixed by a state machine and a blend space"
source-dir = "example/walk"
package-root = "main"
tests = false
libraries = ["SDL3", "SDL3_image", "vulkan", "assimp", "harfbuzz", "freetype"]
targets = ["balder"]
output-dir = "target/demos"

[targets.crates]
type = "executable"
description = "Crates stacked, boxes on a slope and balls thrown: the solver of the physics to look at"
source-dir = "example/crates"
package-root = "main"
tests = false
libraries = ["SDL3", "SDL3_image", "vulkan", "assimp", "harfbuzz", "freetype"]
targets = ["balder"]
output-dir = "target/demos"

[targets.physbench]
type = "executable"
description = "A benchmark of the physics, headless: a scene of dynamic bodies stepped, the cost of each phase of a step reported"
source-dir = "example/physbench"
package-root = "main"
tests = false
libraries = ["SDL3", "SDL3_image", "vulkan", "assimp", "harfbuzz", "freetype"]
targets = ["balder"]
output-dir = "target/demos"

[targets.form]
type = "executable"
description = "An input form, to try the input texts"
source-dir = "example/form"
package-root = "main"
tests = false
libraries = ["SDL3", "SDL3_image", "vulkan", "assimp", "harfbuzz", "freetype"]
targets = ["balder"]
output-dir = "target/demos"

[targets.gallery]
type = "executable"
description = "A gallery of every widget, laid out with flex sizes and content sizes"
source-dir = "example/gallery"
package-root = "main"
tests = false
libraries = ["SDL3", "SDL3_image", "vulkan", "assimp", "harfbuzz", "freetype"]
targets = ["balder"]
output-dir = "target/demos"

[targets.editor]
type = "executable"
description = "The editor of Balder: a scene loaded from a file, its nodes added, selected, moved and removed"
source-dir = "editor/src"
package-root = "main"
output = "balder-editor"
tests = false
libraries = ["SDL3", "SDL3_image", "vulkan", "assimp", "harfbuzz", "freetype"]
targets = ["balder"]
output-dir = "target/bin"

[dependencies]
yassimp = { version = "master", url = { git = "git@github.com:Kag-k-thun/bindy-assimp.git" } }
ysdl3 = { version = "master", url = { git = "git@github.com:Kag-k-thun/bindy-sdl3.git" } }
yvulkan = { version = "master", url = { git = "git@github.com:Kag-k-thun/bindy-vulkan.git" } }
yharfbuzz = { version = "master", url = { git = "git@github.com:Kag-k-thun/bindy-harfbuzz.git" } }

[registry]
local = "/home/emile/.local/gyllir/Balder"

[commands]
shader_compile = { cmd = "./compile.sh", post = false, cwd = "./res/shaders" }

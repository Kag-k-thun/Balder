kind = "raster"
depth = true

# the quads of neighbouring glyphs overlap (italics, kerning), a glyph writing its depth would cut the next one
depth-write = false

[blend]
enabled = true

[vertex]
positions = "vec2"
tex_uv = "vec2"

[pass.vertex]
index = 0
shader = "shaders:/base/2D/text/text.vert.spv"

[pass.fragment]
index = 1
shader = "shaders:/base/2D/text/text.frag.spv"


# ====================================================================================================
# ====================================================================================================
# ====================================          UNIFORMS          ====================================
# ====================================================================================================
# ====================================================================================================

# the dimension of the framebuffer in CSS pixels, then the number of framebuffer pixels in a CSS pixel
[push.window]
offset = 0
size = 16

# the position, the size, the color, the scissors and the level of the shapes, read at the instance of their draws
[set.object.buffer.objects]
binding = 0

[set.object.texture.albedo]
binding = 1
kind = "albedo"
addressMode = "clamp-edge"
mipmap = "near"
anisotropy = false

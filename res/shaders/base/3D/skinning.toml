kind = "compute"

[local-groups]
x = 64
y = 1
z = 1

[pass.compute]
index  = 0
shader = "shaders:/base/3D/skinning/skinning.comp.spv"

# ====================================================================================================
# ====================================================================================================
# ====================================          BUFFERS          =====================================
# ====================================================================================================
# ====================================================================================================

# the vertices of the geometry pool of the shader drawing the skinned instances, their bind vertices among them
[set.object.buffer.rest]
binding = 0

# the four joints moving each bind vertex and their weights
[set.object.buffer.weights]
binding = 1

# the matrix of each joint of the instances, and the one the frame before drew them with
[set.object.buffer.joints]
binding = 2

# the vertices the frame draws, written for each instance
[set.object.buffer.skinned]
binding = 3

# ====================================================================================================
# ====================================================================================================
# =======================================          PC          =======================================
# ====================================================================================================
# ====================================================================================================

# the instance skinned: its bind vertices, its vertices drawn, its weights, its joints, and the layout of its vertices
[push.skin]
offset = 0
size   = 48

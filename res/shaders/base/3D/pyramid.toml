kind = "compute"

[local-groups]
x = 8
y = 8
z = 1

[pass.compute]
index  = 0
shader = "shaders:/base/3D/pyramid/pyramid.comp.spv"

# ====================================================================================================
# ====================================================================================================
# ====================================          TEXTURES          ====================================
# ====================================================================================================
# ====================================================================================================

# the depth of the deferred pass, reduced into the first level
[set.global.texture.depth]
binding     = 0
kind        = "depth"
addressMode = "clamp-edge"
mipmap      = "near"
mag-filter  = "near"
min-filter  = "near"
anisotropy  = false

# ====================================================================================================
# ====================================================================================================
# ====================================          BUFFERS          =====================================
# ====================================================================================================
# ====================================================================================================

# the levels of the pyramid, one float per texel (see balder::scene::utils::pyramid::layout)
[set.global.buffer.pyramid]
binding = 1

# ====================================================================================================
# ====================================================================================================
# =======================================          PC          =======================================
# ====================================================================================================
# ====================================================================================================

# the level read and the level written: their first texel, their size, and whether the level read is the depth
[push.level]
offset = 0
size   = 32

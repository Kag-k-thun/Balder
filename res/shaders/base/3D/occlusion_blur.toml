kind = "compute"

[local-groups]
x = 8
y = 8
z = 1

[pass.compute]
index  = 0
shader = "shaders:/base/3D/occlusion/blur.comp.spv"

# ====================================================================================================
# ====================================================================================================
# =====================================          OUTPUT          =====================================
# ====================================================================================================
# ====================================================================================================

# the occlusion blurred along the axis of the pass
[set.global.storage-texture.output]
binding = 0

# ====================================================================================================
# ====================================================================================================
# ====================================          TEXTURES          ====================================
# ====================================================================================================
# ====================================================================================================

# the occlusion written by the pass before it, read texel by texel
[set.global.texture.input]
binding     = 1
kind        = "albedo"
addressMode = "clamp-edge"
mipmap      = "near"
mag-filter  = "near"
min-filter  = "near"
anisotropy  = false

# the depth of the g-buffer, the texels of another surface left out of the blur
[set.global.texture.depth]
binding     = 2
kind        = "depth"
mipmap      = "near"
anisotropy  = false

# the normals of the g-buffer, the plane of each pixel
[set.global.texture.normals]
binding     = 3
kind        = "albedo"
addressMode = "clamp-edge"
mipmap      = "near"
mag-filter  = "near"
min-filter  = "near"
anisotropy  = false

# ====================================================================================================
# ====================================================================================================
# ====================================          UNIFORM          =====================================
# ====================================================================================================
# ====================================================================================================

# the camera, its exposure after its position
[set.global.uniform.camera]
binding = 4
size    = 208

# ====================================================================================================
# ====================================================================================================
# =======================================          PC          =======================================
# ====================================================================================================
# ====================================================================================================

# the axis of the blur, 0 along the rows, 1 along the columns
[push.level]
offset = 0
size   = 4

kind = "raster"
depth = true

[blend]
enabled = false

[vertex]
positions = "vec3"
normals = "vec3"


# ====================================================================================================
# ====================================================================================================
# ======================================          PASS          ======================================
# ====================================================================================================
# ====================================================================================================

[pass.vertex]
index = 0
shader = "shaders:/base/3D/color/color.vert.spv"

[pass.fragment]
index = 1
shader = "shaders:/base/3D/color/color.frag.spv"

# the depth of the geometry written before the passes draw it, so they shade the closest fragment of each pixel only
[prepass.vertex]
index = 0
shader = "shaders:/base/3D/depth/depth.vert.spv"

[prepass.fragment]
index = 1
shader = "shaders:/base/3D/depth/depth.frag.spv"

# ====================================================================================================
# ====================================================================================================
# ====================================          UNIFORM          =====================================
# ====================================================================================================
# ====================================================================================================

[set.camera.uniform.camera]
binding = 0
size = 204

# ====================================================================================================
# ====================================================================================================
# ====================================          BUFFERS          =====================================
# ====================================================================================================
# ====================================================================================================

# the world, the cross-fade and the material of the objects, read at the instance of their draws
[set.object.buffer.objects]
binding = 0

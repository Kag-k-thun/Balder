kind = "compute"

# one invocation by segment
[local-groups]
x = 64
y = 1
z = 1

[pass.compute]
index  = 0
shader = "shaders:/base/3D/post/debug_lines/draw.comp.spv"

# ====================================================================================================
# ====================================================================================================
# =====================================          OUTPUT          =====================================
# ====================================================================================================
# ====================================================================================================

# the colours of the screen copied by the pass before, the segments drawn over them
[set.global.storage-texture.output]
binding = 0

# ====================================================================================================
# ====================================================================================================
# ====================================          TEXTURES          ====================================
# ====================================================================================================
# ====================================================================================================

# the depth of the g-buffer, the parts of the segments behind the scene faded or dropped
[set.global.texture.depth]
binding     = 1
kind        = "depth"
mipmap      = "near"
anisotropy  = false

# ====================================================================================================
# ====================================================================================================
# ====================================          UNIFORMS          ====================================
# ====================================================================================================
# ====================================================================================================

[set.global.uniform.camera]
binding = 2
size    = 208

# ====================================================================================================
# ====================================================================================================
# =====================================          BUFFERS          ====================================
# ====================================================================================================
# ====================================================================================================

# the number of segments, the opacity of their hidden parts, and the segments (see the Segments block of the shader)
[set.global.buffer.segments]
binding = 3

kind = "compute"

[local-groups]
x = 16
y = 16
z = 1

[pass.compute]
index  = 0
shader = "shaders:/base/3D/post/taa/resolve.comp.spv"

# ====================================================================================================
# ====================================================================================================
# =====================================          OUTPUT          =====================================
# ====================================================================================================
# ====================================================================================================

# the light the camera sees, the frame blended with the history
[set.global.storage-texture.output]
binding = 0

# ====================================================================================================
# ====================================================================================================
# ====================================          TEXTURES          ====================================
# ====================================================================================================
# ====================================================================================================

# the light of the frame, written by the pass before it, read texel by texel
[set.global.texture.input]
binding     = 1
kind        = "albedo"
addressMode = "clamp-edge"
mipmap      = "near"
mag-filter  = "near"
min-filter  = "near"
anisotropy  = false

# the depth of the g-buffer, the closest pixel around each pixel giving its motion
[set.global.texture.depth]
binding     = 2
kind        = "depth"
mipmap      = "near"
anisotropy  = false

# the motion of each pixel since the frame before, in texture coordinates
[set.global.texture.velocity]
binding     = 3
kind        = "albedo"
addressMode = "clamp-edge"
mipmap      = "near"
mag-filter  = "near"
min-filter  = "near"
anisotropy  = false

# the blend of the frame before, a persistent image sampled where each pixel was, between its texels
[set.global.texture.history]
binding     = 4
kind        = "albedo"
addressMode = "clamp-edge"
mipmap      = "near"
mag-filter  = "linear"
min-filter  = "linear"
anisotropy  = false

# ====================================================================================================
# ====================================================================================================
# ====================================          UNIFORM          =====================================
# ====================================================================================================
# ====================================================================================================

# the weight of the frame, the clipping of the history and its reset (see the Params block of the shader)
[set.global.uniform.params]
binding = 5
size    = 16

# the camera, its exposure after its position
[set.global.uniform.camera]
binding = 6
size    = 208

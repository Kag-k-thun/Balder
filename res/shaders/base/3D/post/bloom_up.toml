kind = "compute"

[local-groups]
x = 8
y = 8
z = 1

[pass.compute]
index  = 0
shader = "shaders:/base/3D/post/bloom/up.comp.spv"

# ====================================================================================================
# ====================================================================================================
# =====================================          OUTPUT          =====================================
# ====================================================================================================
# ====================================================================================================

# the level written, the level of the downsampling added to the blurred levels below it
[set.global.storage-texture.output]
binding = 0

# ====================================================================================================
# ====================================================================================================
# ====================================          TEXTURES          ====================================
# ====================================================================================================
# ====================================================================================================

# the level of the downsampling of the size written, the light the stage before it wrote for the last pass, read texel
# by texel
[set.global.texture.input]
binding     = 1
kind        = "albedo"
addressMode = "clamp-edge"
mipmap      = "near"
mag-filter  = "near"
min-filter  = "near"
anisotropy  = false

# the blurred levels below, half the size written, sampled between their texels
[set.global.texture.low]
binding     = 2
kind        = "albedo"
addressMode = "clamp-edge"
mipmap      = "near"
mag-filter  = "linear"
min-filter  = "linear"
anisotropy  = false

# ====================================================================================================
# ====================================================================================================
# ====================================          UNIFORM          =====================================
# ====================================================================================================
# ====================================================================================================

# the threshold and the strength of the bloom (see the Params block of the shader)
[set.global.uniform.params]
binding = 3
size    = 16

# ====================================================================================================
# ====================================================================================================
# =======================================          PC          =======================================
# ====================================================================================================
# ====================================================================================================

# the level written, 0 for the light of the stage after it
[push.level]
offset = 0
size   = 4

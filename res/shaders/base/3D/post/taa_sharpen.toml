kind = "compute"

[local-groups]
x = 16
y = 16
z = 1

[pass.compute]
index  = 0
shader = "shaders:/base/3D/post/taa/sharpen.comp.spv"

# ====================================================================================================
# ====================================================================================================
# =====================================          OUTPUT          =====================================
# ====================================================================================================
# ====================================================================================================

# the blend copied into the history at the level 0, sharpened into the image of the stage at the level 1
[set.global.storage-texture.output]
binding = 0

# ====================================================================================================
# ====================================================================================================
# ====================================          TEXTURES          ====================================
# ====================================================================================================
# ====================================================================================================

# the blend of the frame with the history, read texel by texel
[set.global.texture.input]
binding     = 1
kind        = "albedo"
addressMode = "clamp-edge"
mipmap      = "near"
mag-filter  = "near"
min-filter  = "near"
anisotropy  = false

# ====================================================================================================
# ====================================================================================================
# ====================================          UNIFORM          =====================================
# ====================================================================================================
# ====================================================================================================

# the strength of the sharpening (see the Params block of the shader)
[set.global.uniform.params]
binding = 2
size    = 16

# 0 to copy the blend, 1 to sharpen it
[push.level]
offset = 0
size   = 4

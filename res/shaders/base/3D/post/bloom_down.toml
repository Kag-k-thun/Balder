kind = "compute"

[local-groups]
x = 8
y = 8
z = 1

[pass.compute]
index  = 0
shader = "shaders:/base/3D/post/bloom/down.comp.spv"

# ====================================================================================================
# ====================================================================================================
# =====================================          OUTPUT          =====================================
# ====================================================================================================
# ====================================================================================================

# the level written, half the size of the level read
[set.global.storage-texture.output]
binding = 0

# ====================================================================================================
# ====================================================================================================
# ====================================          TEXTURES          ====================================
# ====================================================================================================
# ====================================================================================================

# the level read, the light the stage before it wrote for the first level, sampled between its texels
[set.global.texture.input]
binding     = 1
kind        = "albedo"
addressMode = "clamp-edge"
mipmap      = "near"
mag-filter  = "linear"
min-filter  = "linear"
anisotropy  = false

# ====================================================================================================
# ====================================================================================================
# ====================================          UNIFORM          =====================================
# ====================================================================================================
# ====================================================================================================

# the threshold and the strength of the bloom (see the Params block of the shader)
[set.global.uniform.params]
binding = 2
size    = 16

# the camera, its exposure after its position
[set.global.uniform.camera]
binding = 3
size    = 208

# ====================================================================================================
# ====================================================================================================
# =======================================          PC          =======================================
# ====================================================================================================
# ====================================================================================================

# the level read, 0 for the light the stage before it wrote
[push.level]
offset = 0
size   = 4

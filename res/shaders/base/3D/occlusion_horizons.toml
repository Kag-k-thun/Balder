kind = "compute"

[local-groups]
x = 8
y = 8
z = 1

[pass.compute]
index  = 0
shader = "shaders:/base/3D/occlusion/horizons.comp.spv"

# ====================================================================================================
# ====================================================================================================
# =====================================          OUTPUT          =====================================
# ====================================================================================================
# ====================================================================================================

# the share of the ambient light reaching each pixel, still noisy
[set.global.storage-texture.output]
binding = 0

# ====================================================================================================
# ====================================================================================================
# ====================================          TEXTURES          ====================================
# ====================================================================================================
# ====================================================================================================

# the depth of the g-buffer, the positions rebuilt from it
[set.global.texture.depth]
binding     = 1
kind        = "depth"
mipmap      = "near"
anisotropy  = false

# the normals of the g-buffer, folded on an octahedron
[set.global.texture.normals]
binding     = 2
kind        = "albedo"
addressMode = "clamp-edge"
mipmap      = "near"
mag-filter  = "near"
min-filter  = "near"
anisotropy  = false

# ====================================================================================================
# ====================================================================================================
# ====================================          UNIFORM          =====================================
# ====================================================================================================
# ====================================================================================================

# the radius, the intensity and the number of directions (see the Params block of the shader)
[set.global.uniform.params]
binding = 3
size    = 16

# the camera, its exposure after its position
[set.global.uniform.camera]
binding = 4
size    = 208

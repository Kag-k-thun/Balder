kind = "compute"

[local-groups]
x = 16
y = 16
z = 1

[pass.compute]
index  = 0
shader = "shaders:/base/3D/tonemap/tonemap.comp.spv"

# ====================================================================================================
# ====================================================================================================
# =====================================          OUTPUT          =====================================
# ====================================================================================================
# ====================================================================================================

# the colours of the screen, encoded in sRGB, written through a unorm view
[set.global.storage-texture.output]
binding = 0

# ====================================================================================================
# ====================================================================================================
# ====================================          TEXTURES          ====================================
# ====================================================================================================
# ====================================================================================================

# the light the camera sees, written by the composition, read texel by texel
[set.global.texture.radiance]
binding     = 1
kind        = "albedo"
addressMode = "clamp-edge"
mipmap      = "near"
mag-filter  = "near"
min-filter  = "near"
anisotropy  = false

# ====================================================================================================
# ====================================================================================================
# ====================================          UNIFORM          =====================================
# ====================================================================================================
# ====================================================================================================

# the camera, its exposure after its position
[set.global.uniform.camera]
binding = 2
size    = 208

# the operator of the tone mapping (see the ToneMap block of the shader)
[set.global.uniform.tone_map]
binding = 3
size    = 16

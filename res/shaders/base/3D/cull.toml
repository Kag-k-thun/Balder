kind = "compute"

[local-groups]
x = 64
y = 1
z = 1

[pass.compute]
index  = 0
shader = "shaders:/base/3D/cull/cull.comp.spv"

# ====================================================================================================
# ====================================================================================================
# ====================================          UNIFORM          =====================================
# ====================================================================================================
# ====================================================================================================

[set.camera.uniform.camera]
binding = 0
size    = 204

# ====================================================================================================
# ====================================================================================================
# ====================================          BUFFERS          =====================================
# ====================================================================================================
# ====================================================================================================

# the levels of the depth pyramid of the frame, when the occluded clusters are culled
[set.camera.buffer.pyramid]
binding = 1

# ====================================================================================================
# ====================================================================================================
# ====================================          BUFFERS          =====================================
# ====================================================================================================
# ====================================================================================================

# the world, the cross-fade, the material and the world box of the objects of the shader of the batch
[set.object.buffer.objects]
binding = 0

# the candidates, the word of each draw laid out, the range of its clusters and the place of their visibility
[set.object.buffer.draws]
binding = 1

# the clusters of the geometries of the shader of the batch, their box, their cone and their range of indices
[set.object.buffer.clusters]
binding = 2

# the commands and the triangles written by each phase, the candidates listed and the dispatch of their clusters, then
# the candidates listed
[set.object.buffer.counters]
binding = 3

# the commands drawing the clusters seen, read by the draw indirect count calls, those of the second phase after
[set.object.buffer.commands]
binding = 4

# the words of the instances of the commands, read by the vertex shaders, each followed by the slot of its cluster
[set.object.buffer.instances]
binding = 5

# the visibility of each cluster of each candidate at the last pass culling the occluded clusters
[set.object.buffer.visibility]
binding = 6

# ====================================================================================================
# ====================================================================================================
# =======================================          PC          =======================================
# ====================================================================================================
# ====================================================================================================

# the number of candidates, the phase of the pass, the height of the view, the size on screen under which an object
# is culled, the width of the view, the number of levels of the depth pyramid (0 to cull the occluded clusters not) and
# the number of clusters each phase culls at most
[push.cull]
offset = 0
size   = 32

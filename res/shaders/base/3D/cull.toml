kind = "compute"

[local-groups]
x = 64
y = 1
z = 1

[pass.compute]
index  = 0
shader = "shaders:/base/3D/cull/cull.comp.spv"

# ====================================================================================================
# ====================================================================================================
# ====================================          UNIFORM          =====================================
# ====================================================================================================
# ====================================================================================================

[set.camera.uniform.camera]
binding = 0
size    = 204

# ====================================================================================================
# ====================================================================================================
# ====================================          BUFFERS          =====================================
# ====================================================================================================
# ====================================================================================================

# the world, the cross-fade, the material and the world box of the objects of the shader of the batch
[set.object.buffer.objects]
binding = 0

# the candidates, the word of each draw laid out and the index of its template
[set.object.buffer.draws]
binding = 1

# the commands grouping the candidates by range of indices
[set.object.buffer.templates]
binding = 2

# the commands and the instances written, then the instances seen in the range of each template
[set.object.buffer.counters]
binding = 3

# the commands drawing the instances seen, read by the draw indirect count call
[set.object.buffer.commands]
binding = 4

# the words of the instances seen, read by the vertex shaders
[set.object.buffer.instances]
binding = 5

# ====================================================================================================
# ====================================================================================================
# =======================================          PC          =======================================
# ====================================================================================================
# ====================================================================================================

# the number of candidates, the phase of the pass, the height of the view and the size on screen under which an
# instance is culled
[push.cull]
offset = 0
size   = 16

kind = "compute"

[local-groups]
x = 32
y = 32
z = 1

[pass.compute]
index  = 0
shader = "shaders:/base/3D/compose/compose.comp.spv"

# ====================================================================================================
# ====================================================================================================
# =====================================          OUTPUT          =====================================
# ====================================================================================================
# ====================================================================================================

[set.global.storage-texture.output]
binding = 0

# ====================================================================================================
# ====================================================================================================
# ====================================          TEXTURES          ====================================
# ====================================================================================================
# ====================================================================================================

[set.global.texture.normals]
binding     = 1
kind        = "albedo"
addressMode = "clamp-edge"
mipmap      = "linear"
anisotropy  = false

[set.global.texture.albedo]
binding     = 2
kind        = "albedo"
addressMode = "clamp-edge"
mipmap      = "linear"
anisotropy  = false

# a depth image, bound in the layout the render graph keeps it in once drawn
[set.global.texture.depth]
binding     = 3
kind        = "depth"
mipmap      = "near"
anisotropy  = false

[set.global.texture.materialID]
binding     = 4
kind        = "albedo"
addressMode = "clamp-edge"
mipmap      = "near"
mag-filter  = "near"
min-filter  = "near"
anisotropy  = false

# the metalness and the roughness of the maps of the materials
[set.global.texture.surface]
binding     = 13
kind        = "albedo"
addressMode = "clamp-edge"
mipmap      = "near"
mag-filter  = "near"
min-filter  = "near"
anisotropy  = false

# the emissive colour of the maps of the materials
[set.global.texture.emissive]
binding     = 14
kind        = "albedo"
addressMode = "clamp-edge"
mipmap      = "near"
mag-filter  = "near"
min-filter  = "near"
anisotropy  = false

# the cascades of the shadow map of the direction light casting shadows, in a 2x2 atlas, each texel compared to the depth
# of the point shaded, the four texels around it filtered (the depth of the deferred while no light casts shadows)
[set.global.texture.shadowMap]
binding     = 5
kind        = "depth"
compare     = true
compare-op  = "less-eq"
mag-filter  = "linear"
min-filter  = "linear"
mipmap      = "near"
anisotropy  = false

# ====================================================================================================
# ====================================================================================================
# ====================================          UNIFORM          =====================================
# ====================================================================================================
# ====================================================================================================

# the cascades of the shadow map (see the Shadow block of the shader)
[set.global.uniform.shadow]
binding = 6
size    = 1040

[set.global.uniform.camera]
binding = 7
size    = 204

# the ambient light of the scene (see the Ambient block of the shader)
[set.global.uniform.ambient]
binding = 12
size    = 16

# ====================================================================================================
# ====================================================================================================
# ====================================          BUFFERS          =====================================
# ====================================================================================================
# ==================================================================================================== 

[set.global.buffer.material]
binding = 8 

[set.global.buffer.direction_light]
binding = 9

[set.global.buffer.point_light]
binding = 10

[set.global.buffer.spot_light]
binding = 11

# ====================================================================================================
# ====================================================================================================
# =======================================          PC          =======================================
# ====================================================================================================
# ====================================================================================================


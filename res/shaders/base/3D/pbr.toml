kind = "raster"
depth = true

[blend]
enabled = false

[vertex]
positions = "vec3"
normals = "vec3"
tangents = "vec4"
tex_uv = "vec2"


# ====================================================================================================
# ====================================================================================================
# ======================================          PASS          ======================================
# ====================================================================================================
# ====================================================================================================


[pass.vertex]
index = 0
shader = "shaders:/base/3D/pbr/pbr.vert.spv"

[pass.fragment]
index = 1
shader = "shaders:/base/3D/pbr/pbr.frag.spv"

# the depth of the geometry written before the passes draw it, so they shade the closest fragment of each pixel only
[prepass.vertex]
index = 0
shader = "shaders:/base/3D/depth/depth.vert.spv"

[prepass.fragment]
index = 1
shader = "shaders:/base/3D/depth/depth.frag.spv"


# ====================================================================================================
# ====================================================================================================
# ====================================          UNIFORM          =====================================
# ====================================================================================================
# ====================================================================================================

[set.camera.uniform.camera]
binding = 0
size = 204

# ====================================================================================================
# ====================================================================================================
# ====================================          BUFFERS          =====================================
# ====================================================================================================
# ====================================================================================================

# the world, the cross-fade and the material of the objects, in the slots given by the words of the instances
[set.object.buffer.objects]
binding = 0

# the word of each instance drawn, the slot of its object and the role of its draw
[set.object.buffer.instances]
binding = 1

# ====================================================================================================
# ====================================================================================================
# ====================================          TEXTURES          ====================================
# ====================================================================================================
# ====================================================================================================

# the maps shared by the objects drawn together, their texture coordinates repeated

# the base colour, in sRGB
[set.object.texture.base_color]
binding = 2
kind = "albedo"
addressMode = "repeat"
mipmap = "linear"
anisotropy = true

# the roughness (green) and the metalness (blue), in a linear space
[set.object.texture.metallic_roughness]
binding = 3
kind = "albedo"
addressMode = "repeat"
mipmap = "linear"
anisotropy = true

# the normals in tangent space, in a linear space
[set.object.texture.normal]
binding = 4
kind = "albedo"
addressMode = "repeat"
mipmap = "linear"
anisotropy = true

# the occlusion (red), in a linear space
[set.object.texture.occlusion]
binding = 5
kind = "albedo"
addressMode = "repeat"
mipmap = "linear"
anisotropy = true

# the emissive colour, in sRGB
[set.object.texture.emissive]
binding = 6
kind = "albedo"
addressMode = "repeat"
mipmap = "linear"
anisotropy = true

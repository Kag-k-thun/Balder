kind = "raster"
depth = true

[blend]
enabled = false

[vertex]
positions = "vec3"
normals = "vec3"
tex_uv = "vec2"


# ====================================================================================================
# ====================================================================================================
# ======================================          PASS          ======================================
# ====================================================================================================
# ====================================================================================================


[pass.vertex]
index = 0
shader = "shaders:/base/3D/texture/texture.vert.spv"

[pass.fragment]
index = 1
shader = "shaders:/base/3D/texture/texture.frag.spv"

# the depth of the geometry written before the passes draw it, so they shade the closest fragment of each pixel only
[prepass.vertex]
index = 0
shader = "shaders:/base/3D/depth/depth.vert.spv"

[prepass.fragment]
index = 1
shader = "shaders:/base/3D/depth/depth.frag.spv"

# ====================================================================================================
# ====================================================================================================
# ======================================          SKIN          ======================================
# ====================================================================================================
# ====================================================================================================

# the variant drawing skinned vertices, moved by the joints of their skin in the skin pass of the scene before they are
# drawn: each vertex also holds the position the frame before drew it at, the vertex pass writing the motion from it
[skin.vertex]
previous = "vec3"

[skin.pass.vertex]
index = 0
shader = "shaders:/base/3D/texture/texture_skin.vert.spv"


# ====================================================================================================
# ====================================================================================================
# ====================================          UNIFORM          =====================================
# ====================================================================================================
# ====================================================================================================

[set.camera.uniform.camera]
binding = 0
size = 276

# ====================================================================================================
# ====================================================================================================
# ====================================          BUFFERS          =====================================
# ====================================================================================================
# ====================================================================================================

# the world, the cross-fade and the material of the objects, in the slots given by the words of the instances
[set.object.buffer.objects]
binding = 0

# the word of each instance drawn, the slot of its object and the role of its draw
[set.object.buffer.instances]
binding = 1

# ====================================================================================================
# ====================================================================================================
# ====================================          TEXTURES          ====================================
# ====================================================================================================
# ====================================================================================================

# the texture shared by the objects drawn together
[set.object.texture.albedo]
binding = 2
kind = "albedo"
addressMode = "clamp-edge"
mipmap = "linear"
anisotropy = true

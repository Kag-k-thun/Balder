kind = "raster"
depth = true

[blend]
enabled = false

[vertex]
positions = "vec3"
normals = "vec3"
tex_uv = "vec2"


# ====================================================================================================
# ====================================================================================================
# ======================================          PASS          ======================================
# ====================================================================================================
# ====================================================================================================


[pass.vertex]
index = 0
shader = "shaders:/base/3D/texture/texture.vert.spv"

[pass.fragment]
index = 1
shader = "shaders:/base/3D/texture/texture.frag.spv"


# ====================================================================================================
# ====================================================================================================
# ====================================          UNIFORM          =====================================
# ====================================================================================================
# ====================================================================================================

[set.camera.uniform.camera]
binding = 0
size = 204

# ====================================================================================================
# ====================================================================================================
# ====================================          BUFFERS          =====================================
# ====================================================================================================
# ====================================================================================================

# the world, the cross-fade and the material of the objects, read at the instance of their draws
[set.object.buffer.objects]
binding = 0

# ====================================================================================================
# ====================================================================================================
# ====================================          TEXTURES          ====================================
# ====================================================================================================
# ====================================================================================================

# the texture shared by the objects drawn together
[set.object.texture.albedo]
binding = 1
kind = "albedo"
addressMode = "clamp-edge"
mipmap = "linear"
anisotropy = true

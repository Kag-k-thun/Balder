log-filter = ["Widget", "Swapchain", "Texture2D", "Window", "Memory", "GarbageBin", "VulkanPipeline", "VulkanTransferPass"]

[window]
name = "Balder crates"
width = {relative = 0.8, min = 800}
height = {relative = 0.8, min = 600}
resizable = true

[vulkan]
version = 13
anisotropy = true
image-count = 3
vsync = false

[timer]
fps = 60
ips = 60
physics = 60
catch-up = 4
interactive = true

[shadow]
scale = 2048
distance = 40.0
atlas = 1024
lights = 1

[physics]
gravity = [0.0, -9.81, 0.0]
substeps = 4
iterations = 2

log-filter = ["Widget", "Swapchain", "Texture2D", "Window", "Memory", "GarbageBin", "VulkanPipeline", "VulkanTransferPass"]

[window]
name = "Balder walk"
width = {relative = 0.8, min = 800}
height = {relative = 0.8, min = 600}
resizable = true

[vulkan]
version = 13
anisotropy = true
image-count = 3
vsync = false

[timer]
fps = 60
ips = 60
interactive = true

[shadow]
scale = 2048
distance = 30.0
atlas = 1024
lights = 1

log-filter = ["Widget", "Swapchain", "Texture2D", "Window", "Memory", "GarbageBin", "VulkanPipeline", "VulkanTransferPass"]

[window]
name = "Balder clock"
width = {relative = 0.8, min = 800}
height = {relative = 0.8, min = 600}
resizable = true

[vulkan]
version = 13
anisotropy = true
image-count = 3
vsync = false

[timer]
fps = 60
ips = 60
physics = 60
catch-up = 4
interactive = true

[shadow]
scale = 2048
distance = 8.0
atlas = 1024
lights = 1

# the teeth push each other through four meshes from the mainspring to the anchor: more sub steps and passes than a
# pile of crates, or the escapement lets a tooth slip now and then
[physics]
gravity = [0.0, -9.81, 0.0]
substeps = 8
iterations = 4

log-filter = ["Widget", "Swapchain", "Texture2D", "Window", "Memory", "GarbageBin", "VulkanPipeline", "VulkanTransferPass"]

[window]
name = "Ymir is the Best !"
width = {relative = 0.8, min = 800}
height = {relative = 0.8, min = 600}
resizable = true

[vulkan]
version = 13
anisotropy = true
image-count = 3
vsync = false

[timer]
fps = 30
ips = 60
physics = 60
catch-up = 4
interactive = true

# the shadow map of the direction light casting shadows: the texels on a side of its atlas (2x2 cascades), and the depth
# in the view of the camera up to which the shadows are drawn; the texels on a side of the atlas of the point and spot
# lights, and the number of them a frame shadows at most
[shadow]
scale = 2048
distance = 50.0
atlas = 4096
lights = 8

# the physics of the scenes (their steps a second are `physics` of [timer]): the gravity, the sub steps a step is solved
# in, those an island is solved in at most when its lightest body carrying its heaviest one would sink deeper than
# `max-sink` metres, the passes of the solver over the contacts and the joints at each, the frequency and the damping
# ratio of the spring pushing a penetration out, those of the spring pulling the error of a joint back, the speed of the
# first at most, the closing speed under which a contact does not bounce, and the speeds under which an island still for
# `sleep-time` seconds sleeps
[physics]
gravity = [0.0, -9.81, 0.0]
substeps = 4
max-substeps = 16
max-sink = 0.005
iterations = 2
contact-hertz = 60.0
contact-damping = 10.0
joint-hertz = 60.0
joint-damping = 2.0
max-correction = 2.0
bounce-threshold = 1.0
sleep-linear = 0.05
sleep-angular = 0.05
sleep-time = 0.5

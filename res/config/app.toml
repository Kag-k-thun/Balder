log-filter = ["Widget", "Swapchain", "Texture2D", "Window", "Memory", "GarbageBin", "VulkanPipeline", "VulkanTransferPass"]

[window]
name = "Ymir is the Best !"
width = {relative = 0.8, min = 800}
height = {relative = 0.8, min = 600}
resizable = true

[vulkan]
version = 13
anisotropy = true
image-count = 3
vsync = false

[timer]
fps = 30
ips = 30
interactive = true

# the shadow map of the light casting shadows: the texels on a side of its atlas (2x2 cascades), and the depth in the
# view of the camera up to which the shadows are drawn
[shadow]
scale = 2048
distance = 50.0

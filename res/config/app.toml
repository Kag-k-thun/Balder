log-filter = ["Widget", "Swapchain", "Texture2D", "Window", "Memory", "GarbageBin", "VulkanPipeline", "VulkanTransferPass"]

[window]
name = "Ymir is the Best !"
width = {relative = 0.8, min = 800}
height = {relative = 0.8, min = 600}
resizable = true

[vulkan]
version = 13
anisotropy = true
image-count = 3
vsync = false

[timer]
fps = 30
ips = 30
interactive = true

# the shadow map of the direction light casting shadows: the texels on a side of its atlas (2x2 cascades), and the depth
# in the view of the camera up to which the shadows are drawn; the texels on a side of the atlas of the point and spot
# lights, and the number of them a frame shadows at most
[shadow]
scale = 2048
distance = 50.0
atlas = 4096
lights = 8
